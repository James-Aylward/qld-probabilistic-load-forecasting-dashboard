[project]
name = "powerprophet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Aylward", email = "j.aylward@student.uq.edu.au" }
]
requires-python = ">=3.14"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "dash-leaflet>=1.1.3",
    "numpy>=2.5.2",
    "polars>=1.44.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
powerprophet = "powerprophet:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
